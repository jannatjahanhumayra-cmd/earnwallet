<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>EarnWallet Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/admin" aria-label="EarnWallet Admin home">
        <span class="brand-mark">E</span>
        <span class="brand-copy"><strong>EarnWallet</strong><small>ADMIN PANEL</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Admin navigation">
        <button class="nav-item active" type="button" data-page="dashboard">
          <span class="nav-icon">▦</span><span>Dashboard</span>
        </button>
      </nav>
      <div class="sidebar-bottom"><span class="connection-dot"></span> Existing backend connection</div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div><div class="eyebrow">EARNWALLET / ADMIN</div><h1 id="pageTitle">Dashboard</h1></div>
        <div class="secure-label"><span class="secure-dot"></span> Secure session</div>
      </header>
      <section id="content" class="content-area" aria-live="polite">
        <div class="loading-state">Loading dashboard…</div>
      </section>
      <footer class="footer-note">ADMIN CONSOLE <span>•</span> PHASE 1</footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
